num_trials: 10
num_workers: 4  # for dataloaders

model:
  M: 100 # number of predictors; for stumps: 2*M per dimension
  prior: 0.1 #.00001 # param of the Dirichlet prior
  pred: "rf" # random forest or "stumps-uniform"
  bootstrap: 0.5 # for informed priors
  tree_depth: None # for informed priors
  

  m: 0.5 # for informed priors: use first m * N_train points to learn one prior, and last (1-m) * N_train to learn the other prior
  uniform: False

pretraining:
  learnt_prior : False

training:
  seed: 23042021
  lr: 0.1
  batch_size: 1024
  num_epochs: 100
  risk: "des_rivasplata_dir" #"exact" # or MC, SO, FO, Rnd, CB
  opt_bound: True # or optimize only risk
  sigmoid_c: 100 # only for MC
  rand_n: 100 # only for Rnd
  MC_draws: 1 # only for MC
  order : 1.5 #only for Renyi bounds
  risk_type : "draw" # "expectation" or "draw" for disintegrated, "stochastic" otherwise
  barrier: 100 # only for CB: parameter t of the log-barrier extension of Viallard et al. (2021)

dataset: 'PROTEIN'

bound:
  delta: 0.05
  type: "seeger" # CB always uses its own certificate, saved under "cbound"
  stochastic: False
